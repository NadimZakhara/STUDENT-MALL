
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Mall</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Student Mall</h1>
        <p>Your one-stop shop for student essentials</p>
    </header>
    <main>
        <section class="products">
            <div class="product-card">
                <img src="images/notebook.jpg" alt="Apsara Notebook">
                <h2>Apsara Notebook</h2>
                <p>₹30</p>
            </div>
            <div class="product-card">
                <img src="images/bottle.jpg" alt="Water Bottle">
                <h2>Water Bottle</h2>
                <p>₹99</p>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2025 Student Mall</p>
    </footer>
</body>
</html>
